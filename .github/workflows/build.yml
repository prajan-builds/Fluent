name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir www && cp index.html www/
          echo '{"appId":"com.fluent.englishcoach","appName":"Fluent","webDir":"www","plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7 @capacitor-community/speech-recognition@7
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" /><queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries><application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          files: android/app/build/outputs/apk/debug/app-debug.apk
